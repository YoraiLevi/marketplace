name: sync-template

# The template-update channel for FORKS (docs/UPDATING.md): daily, pull the
# upstream template's machinery improvements into this marketplace without
# touching the fork's content (all of src/ — forks own that tree outright).
#
# Design notes:
# - `-X ours` conflict policy is safe BY CONSTRUCTION here: forks only edit
#   src/ (which they own outright), so conflicts can only be (a) generated files — the merge
#   resolution is irrelevant because this workflow regenerates them from
#   source right after — or (b) the fork's metadata file, where "ours" is
#   correct by definition.
# - Regeneration happens IN THIS RUN: pushes made with the default CI token
#   do not trigger other workflows, so regen-bot would NOT fire on the sync
#   push. One workflow = merge + regenerate + test + push, atomically.
# - Never runs on the template repository itself.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

env:
  TEMPLATE_REPO: DgxSparkLabs/marketplace-template

jobs:
  sync:
    if: github.repository != 'DgxSparkLabs/marketplace-template'
    runs-on: ubuntu-latest
    env:
      # Optional one-time setup for FULLY hands-off updates: a fine-grained PAT
      # with contents+workflows write, saved as the SYNC_TOKEN secret. Without
      # it, the default CI token cannot push .github/workflows/ changes
      # (GitHub restriction), so workflow-file updates are held back and an
      # issue is opened with the one command that completes them.
      HAS_SYNC_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history — required to merge the template branch
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - uses: astral-sh/setup-uv@v5
      - name: Merge template/main (fork content wins conflicts)
        id: merge
        run: |
          git config merge.ours.driver true  # honor the fork-owned allowlist in .gitattributes
          git config user.name "marketplace-generator"
          git config user.email "generator@dgxsparklabs.invalid"
          PRE=$(git rev-parse HEAD)
          git remote add template "https://github.com/${TEMPLATE_REPO}"
          git fetch template main
          if git merge-base --is-ancestor template/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with the template."
            exit 0
          fi
          if ! git merge -X ours --no-edit template/main; then
            # -X ours resolves content conflicts but not file-level ones
            # (e.g. template deleted a file this fork modified). Policy is
            # the same: the fork's state wins; deletions of files the fork
            # never touched merge cleanly anyway.
            git status --porcelain | awk '$1 ~ /U|AA|DD/ {print $2}' | while read -r p; do
              git checkout --ours -- "$p" 2>/dev/null && git add -- "$p" || git rm -q -- "$p"
            done
            git commit --no-edit
          fi
          # Default token cannot push workflow-file changes: hold them back
          # (keep this fork's current workflows) unless SYNC_TOKEN is set.
          if [ "$HAS_SYNC_TOKEN" != "true" ] && ! git diff --quiet "$PRE" HEAD -- .github/workflows; then
            git checkout "$PRE" -- .github/workflows
            git add .github/workflows
            git commit --amend --no-edit
            echo "workflows_held=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows_held=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Regenerate, validate, test (under this fork's identity)
        if: steps.merge.outputs.changed == 'true'
        run: |
          uv run scripts/validate_source.py
          uv run scripts/generate_manifest.py
          uv run scripts/tasks.py test
      - name: Push the update
        if: steps.merge.outputs.changed == 'true'
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "chore(generated): regenerate after template sync"
          git push
      - name: Open an issue for the held-back workflow updates
        if: steps.merge.outputs.workflows_held == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "The template updated files under .github/workflows/, which the default CI token cannot push (GitHub restriction). Everything else synced automatically."
            echo ""
            echo "Complete the update by running (with your own credentials):"
            echo ""
            echo '```bash'
            echo "git fetch https://github.com/${TEMPLATE_REPO} main"
            echo "git checkout FETCH_HEAD -- .github/workflows"
            echo "git commit -m 'chore: apply template workflow updates' && git push"
            echo '```'
            echo ""
            echo "Or make this fully automatic forever: add a fine-grained PAT (Contents + Workflows write) as the SYNC_TOKEN repository secret. See docs/UPDATING.md."
          } > /tmp/issue-body.md
          # The run summary is the channel that ALWAYS works; the issue is
          # best-effort (forks have Issues disabled by default).
          {
            echo "## Template sync: workflow updates held back"
            echo ""
            cat /tmp/issue-body.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Template sync::Workflow-file updates from the template were held back - see the run summary for the one command that completes them (or add a SYNC_TOKEN secret / enable Issues for notifications)."
          gh issue create --title "Template sync: workflow updates need one manual step" --body-file /tmp/issue-body.md || echo "note: could not open an issue (Issues disabled on this fork?) - the run summary above carries the instructions"
