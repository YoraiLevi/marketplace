name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Validate sources (naming standard N1/N2/N4, issue #19)
        run: uv run scripts/validate_source.py

      - name: Validate generated manifests are in sync with sources
        run: uv run scripts/generate_manifest.py --check

      # Single entrypoint: scripts/tasks.py SUITES is the one source of truth
      # for which suites exist — hardcoding them here drifted twice (PR #37,
      # PR #38) when suites were removed.
      - name: Run all test suites
        run: uv run scripts/tasks.py test
