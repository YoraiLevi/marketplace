name: custom-hello

# A hello-world example of the fork-owned custom-*.yml workflow zone, which the
# template sync never overwrites (docs/UPDATING.md). Manual-trigger only, so it
# never runs on its own. Copy it into your own custom-<name>.yml to build real
# fork automation (a scheduled vendoring job, a custom check, ...).

on:
  workflow_dispatch: {}

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - name: Run the example custom script
        run: uv run custom/hello_custom.py
