name: regen-bot

# Auto-regenerate committed artifacts (manifests, the generated catalog doc) so
# contributors only edit src/ and never run the generator (issue #18: the
# fork→commit→CI→install contract).
#
# Two triggers:
#  - push to main: the template's primary path — a skill folder pushed to a
#    fork's main is packaged and committed back automatically. Works in forks
#    once the forker enables Actions (one click).
#  - same-repo PR branches: regenerates on the PR so the drift gate is green
#    at merge. Fork PRs fall back to the ci.yml drift gate + scripts/regen.*.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  regenerate:
    # PR events: skip on fork PRs (Actions has no write token for a fork's
    # branch). Push events: always run — in a fork, github.repository IS the
    # fork, so the bot pushes to the fork's own main.
    # Loop guard: the bot's own regen commit touches only generated paths
    # (never src/ or scripts/), so the paths filter above cannot re-trigger
    # on it; the actor check is defense in depth.
    if: >-
      (github.event_name == 'push' && github.actor != 'marketplace-generator') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Validate sources (naming standard, issue #19)
        run: uv run scripts/validate_source.py
      - name: Regenerate from src/
        run: uv run scripts/generate_manifest.py
      - name: Run test suites against regenerated output
        run: uv run scripts/tasks.py test
      - name: Commit regenerated artifacts if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            # Deterministic build bot — NOT an AI identity (project rule: no AI attribution).
            git config user.name "marketplace-generator"
            git config user.email "generator@dgxsparklabs.invalid"
            git add -A
            git commit -m "chore(generated): regenerate manifests"
            git push
          else
            echo "No drift; generated artifacts already in sync."
          fi
